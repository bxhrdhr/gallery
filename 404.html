<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="5;url=/" id="meta-refresh">
<meta name="theme-color" content="#05070d">
<title>页面走丢了 · 时光图库</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
html, body { margin: 0; height: 100%; }
body {
    font-family: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
    background: #05070d;
    color: #e8e2d4;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; overflow: hidden;
}
/* 背景噪点 + 光晕 */
.noise {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.05;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.glow { position: fixed; border-radius: 50%; filter: blur(90px); z-index: 0; pointer-events: none; }
.glow.a { width: 420px; height: 420px; top: -140px; left: -120px; background: rgba(212,175,55,.12); }
.glow.b { width: 380px; height: 380px; bottom: -130px; right: -110px; background: rgba(80,140,220,.10); }

.card {
    position: relative; z-index: 2;
    text-align: center; max-width: 420px; width: 100%;
    background: rgba(18, 24, 36, 0.55);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(212,175,55,.22);
    border-radius: 24px;
    padding: 44px 30px 38px;
    box-shadow: 0 24px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
    animation: pop .6s cubic-bezier(.2,.9,.3,1.15) both;
}
@keyframes pop { from { opacity: 0; transform: translateY(26px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

.num {
    font-family: 'Cinzel', 'Georgia', serif;
    font-size: 88px; font-weight: 700; line-height: 1;
    letter-spacing: .08em; text-indent: .08em;
    background: linear-gradient(150deg, #f0d9a6, #d4af37 55%, #a8892e);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    text-shadow: 0 0 40px rgba(212,175,55,.25);
    margin: 0 0 6px;
}
.num small { font-size: 22px; vertical-align: super; letter-spacing: 0; }
.rule { width: 44px; height: 1px; background: linear-gradient(90deg, transparent, rgba(212,175,55,.7), transparent); margin: 18px auto; }
h1 { margin: 0 0 10px; font-size: 18px; font-weight: 600; letter-spacing: .22em; color: #f0e9d8; }
p { margin: 0 0 6px; font-size: 13px; letter-spacing: .14em; color: rgba(232,226,212,.55); line-height: 1.9; }
.tip { margin-top: 6px; font-size: 12px; letter-spacing: .12em; color: rgba(212,175,55,.75); }
.go {
    display: inline-block; margin-top: 24px; padding: 13px 46px; border-radius: 999px;
    font-family: inherit; font-size: 14px; letter-spacing: .3em; text-indent: .3em;
    color: #1a1507; border: none; cursor: pointer; text-decoration: none;
    background: linear-gradient(135deg, #f0d9a6, #d4af37);
    box-shadow: 0 12px 30px rgba(212,175,55,.28);
    transition: transform .25s ease, box-shadow .25s ease;
}
.go:active { transform: scale(.95); }
.go:hover { box-shadow: 0 14px 36px rgba(212,175,55,.4); }
</style>
</head>
<body>
<div class="noise" aria-hidden="true"></div>
<div class="glow a" aria-hidden="true"></div>
<div class="glow b" aria-hidden="true"></div>

<main class="card">
    <div class="num">404<small>.</small></div>
    <div class="rule"></div>
    <h1 class="t">这条路，走不到回忆里了</h1>
    <p class="s">页面走丢了 · 照片还在原地</p>
    <p class="hint" id="tip">将在 <b id="cnt">5</b> 秒后自动返回主页</p>
    <a class="go" id="go" href="/">返回主页</a>
</main>

<script>
(function () {
    var go = document.getElementById('go');
    var cnt = document.getElementById('cnt');
    var left = 5;
    /* 跳到仓库根（当前站点子目录 /gallery/ 的相对路径），确保回到主页 */
    function back() { location.replace('/'); }
    go.addEventListener('click', back);
    var t = setInterval(function () {
        left--;
        if (cnt) cnt.textContent = left;
        if (left <= 0) { clearInterval(t); back(); }
    }, 1000);
})();
</script>
</body>
</html>
