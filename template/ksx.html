.img-wrap {
    aspect-ratio: 3/4;
    position: relative;
    border-radius: 3px;
    overflow: hidden;
    background: rgba(18, 24, 36, 0.32);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    contain: content;
}
/* 仅在交互(悬停放大)时提升合成层，避免全列表常驻 80+ 合成层 */
.img-wrap.loaded:hover {
    will-change: transform, filter;
}

.img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    position: absolute;
    inset: 0;
    transition: opacity 0.6s ease;
    cursor: pointer; 
    transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1), filter 0.6s ease, opacity 0.6s ease;
    filter: brightness(0.9) contrast(0.95) saturate(0.9);
    backface-visibility: hidden;
    z-index: 1;
    transform: translateZ(0);
}

.img-wrap.loaded img {
    opacity: 1;
}

.img-wrap.loaded:hover img {
    transform: scale(1.04);
    filter: brightness(1.05) contrast(1.05) saturate(1.05);
}

img:not([src]), img[src=""], img:-moz-broken {
    opacity: 0 !important;
    visibility: hidden;
}

.status-icon {
    position: relative;
    width: 16px;
    height: 16px;
    color: #606060;
    z-index: 2;
    transition: opacity 0.3s ease;
}

.img-wrap:not(.error) .status-icon {
    animation: rotate 1.2s linear infinite;
}

.img-wrap.error .status-icon {
    color: #606060;
    animation: none;
}

.img-wrap.loaded .status-icon {
    opacity: 0;
    pointer-events: none;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    cursor: pointer; transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1), filter 0.6s ease;

#intro {

    cursor: pointer;
}
#intro.out { opacity: 0; pointer-events: none; }
body.intro-lock { overflow: hidden; }
.intro-bg {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(110% 72% at 50% 118%, rgba(105, 126, 204, 0.20), rgba(105, 126, 204, 0) 60%),
        radial-gradient(95% 55% at 50% -8%, rgba(158, 178, 255, 0.12), rgba(158, 178, 255, 0) 60%),
        linear-gradient(180deg, rgba(4,6,13,0.62) 0%, rgba(10,15,32,0.5) 58%, rgba(12,17,38,0.55) 100%);
}
.intro-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(46% 30% at 50% 46%, rgba(212, 175, 55, 0.055), transparent 70%);
}
/* 星空层（canvas 绘制带光晕的星点） */
.intro-sky {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}
.intro-shoot {
    position: absolute;
    left: 0;
    top: 0;
    width: 150px;
    height: 2px;
    z-index: 2;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.35) 55%, rgba(255, 255, 255, 0));
    box-shadow: 0 0 12px rgba(190, 214, 255, 0.9);
    opacity: 0;
    transform: translate(56vw, -8vh) rotate(-33deg);
    animation: introShoot 1.7s ease-out .4s 1 forwards;
}
@keyframes introShoot {
    0%   { opacity: 0; transform: translate(70vw, -12vh) rotate(-33deg) scaleX(.15); }
    10%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-12vw, 44vh) rotate(-33deg) scaleX(1); }
}

.intro-copy {
    position: relative;
    z-index: 4;
    text-align: center;
    max-width: 92vw;
    padding: 0 22px;
}
.i-eyebrow {
    margin: 0 0 30px;
    font-size: 13px;
    letter-spacing: 0.62em;
    text-indent: 0.62em;
    color: rgba(224, 205, 152, 0.92);
    text-shadow: 0 0 18px rgba(224, 205, 152, 0.55);
    opacity: 0;
    animation: iUp .9s ease .75s forwards;
}
.i-title { margin: 0 0 26px; }
.i-line {
    margin: 0;
    font-size: clamp(27px, 7vw, 50px);
    line-height: 1.6;
    letter-spacing: 0.13em;
    text-indent: 0.13em;
    color: #f7efdb;
    text-shadow:
        0 0 30px rgba(255, 228, 180, 0.35),
        0 0 90px rgba(150, 180, 255, 0.28);
    opacity: 0;
}
.i-title .i-line:nth-child(1) { animation: iUp 1s cubic-bezier(.2, .8, .2, 1) 1.4s forwards; }
.i-title .i-line:nth-child(2) { animation: iUp 1s cubic-bezier(.2, .8, .2, 1) 2.15s forwards; }
.i-sub {
    margin: 0 0 46px;
    font-size: 14px;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: rgba(198, 210, 240, 0.72);
    text-shadow: 0 0 16px rgba(140, 165, 235, 0.35);

.intro-cta {
    display: inline-block;
    padding: 14px 52px 14px 58px;

        iUp .9s ease 3.9s forwards,

    function initAudio() {
        if(inited) return;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if(!AC) return;
            ac = new AC();
            an = ac.createAnalyser();
            an.fftSize = 128;
            an.smoothingTimeConstant = 0.85;
            src = ac.createMediaElementSource(u);
            src.connect(an);
            an.connect(ac.destination);
            ctx = cvs.getContext('2d', { alpha: true });
            resize();
            window.addEventListener('resize', resize);
            inited = true;
            if('mediaSession' in navigator){
                navigator.mediaSession.setActionHandler('play', () => u.play());
                navigator.mediaSession.setActionHandler('pause', () => u.pause());
                navigator.mediaSession.setActionHandler('previoustrack', () => ld(c-1));
                navigator.mediaSession.setActionHandler('nexttrack', () => ld(c+1));
            }
            render();
        } catch(e) { console.log(e); }
    }

    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cvs.width = cvs.offsetWidth * dpr;
        cvs.height = cvs.offsetHeight * dpr;
        if(ctx) {
            ctx.scale(dpr, dpr);
            gr = ctx.createLinearGradient(0, cvs.offsetHeight, 0, 0);
            gr.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
            gr.addColorStop(0.4, 'rgba(212, 175, 55, 0.3)');
            gr.addColorStop(1, 'rgba(212, 175, 55, 0)');
            
            ctx.shadowBlur = 4;
            ctx.shadowColor = 'rgba(212, 175, 55, 0.4)';
        }
    }

    function render() {
        if(!inited) return;
        requestAnimationFrame(render);
        const w = cvs.offsetWidth;
        const h = cvs.offsetHeight;
        ctx.clearRect(0, 0, w, h);
        if(u.paused) return;
        
        const len = an.frequencyBinCount;
        const da = new Uint8Array(len);
        an.getByteFrequencyData(da);
        
        const bars = 48;
        const step = Math.floor(len * 0.8 / bars);
        const gap = w / bars;
        const bw = gap * 0.4;
        
        ctx.fillStyle = gr;
        ctx.beginPath();
        
        for(let i = 0; i < bars; i++) {
            let sum = 0;
            for(let j = 0; j < step; j++) {
                sum += da[i * step + j];
            }
            const avg = sum / step;
            const val = (Math.pow(avg / 255, 1.5)) * h * 0.4;
            
            const x = i * gap + gap/2 + 12;
            const y = h - val;
            
            ctx.roundRect(x - bw/2, y, bw, val + 2, 4);
        }
        ctx.fill();
    }

    const origQueue = [];

        if (origRunning || !origQueue.length) return;

            im.decoding = 'async';

            const done = () => {
                if ('requestIdleCallback' in window) window.requestIdleCallback(step, { timeout: 1000 });

const showImage = (index, dir) => {

    const tmbSrc = ASSET_BASE + f.replace('img/', 'img/thumbs/') + (_sha8 ? '?v=' + _sha8 : '');
    // 防残留/竞态：自增 token，只有最新一次加载完成才真正显示，避免短暂显示上一张/错图
    const token = ++imgToken;
    vImg.style.opacity = '0';
    vImg.onload = () => { if (token === imgToken) vImg.style.opacity = '1'; };
    vImg.onerror = () => { if (token === imgToken) vImg.style.opacity = '1'; };
    vImg.src = px(tmbSrc);
    vImg.onload = () => {
        if (token !== imgToken) return;
        vImg.style.opacity = '1';
        var _bi = new Image();
        _bi.onload = function () { if (token === imgToken) vImg.src = imgSrc; };
        _bi.onerror = function () { if (!_bi.dataset.fb) { _bi.dataset.fb = '1'; if (!webpFallback(_bi)) pxFallback(_bi); } };
        _bi.src = px(imgSrc);
    };
    v.style.display = 'flex';
    const target = vImg;

    target.style.animation = 'none';
    void target.offsetWidth;
    //上下滑动时间
    if (dir === 'next') target.style.animation = 'slideNext 0.4s ease-out forwards';
      //点击显示时间

    var vCount = document.getElementById('vCount');
    if (vCount) vCount.textContent = (index + 1) + ' / ' + imageFiles.length;

    preloadImage(index + 1);
    preloadImage(index - 1);
};

            let timeTaken = Date.now() - startTime;

        if (!b) { el.style.background = 'linear-gradient(165deg,#24402e,#1a3223 55%,#0c1a11)'; return; }
        if (b.type === 'img' && b.url) {
            el.style.background = 'url(' + ASSET_BASE + b.url + ') center/cover no-repeat';
        } else {
            el.style.background = b.css || 'linear-gradient(165deg,#24402e,#1a3223 55%,#0c1a11)';
        }
    }
    var tplBgTimer = null, tplBgIdx = 0;
    function applyBgTplId(id) { CFG.tplBg = id; applyBgTpl(); }
    function startTplBgAuto() {
        stopTplBgAuto();
        var bs = CFG.tplBgs || [];
        if (!CFG.tplBgAuto || bs.length < 2) return;
        var start = 0;
        for (var i = 0; i < bs.length; i++) if (bs[i].id === CFG.tplBg) { start = i; break; }
        tplBgIdx = start;
        tplBgTimer = setInterval(function () {
            tplBgIdx = (tplBgIdx + 1) % bs.length;
            applyBgTplId(bs[tplBgIdx].id);
        }, (CFG.tplBgAutoSec || 8) * 1000);
    }
    function stopTplBgAuto() { if (tplBgTimer) { clearInterval(tplBgTimer); tplBgTimer = null; } }
    applyBgTpl();
    startTplBgAuto();

    q.onclick=pp;
    b.onclick=()=>{ld(c-1)};
    n.onclick=()=>{ld(c+1)};

    // 修复：在首次用户手势的捕获阶段即建立 Web Audio 通路（createMediaElementSource），
    // 保证之后任何 u.play() 都发生在通路就绪之后，避免"播放中接管 audio 元素"
    // 造成歌曲开头重复/叠音（线上网络延迟时尤其明显）。
    function warmAudio() {
        if(!inited && t.length) initAudio();
        if(ac && ac.state === 'suspended') ac.resume();
    }
    document.addEventListener('pointerdown', warmAudio, { capture: true, once: true });
    document.addEventListener('touchstart', warmAudio, { capture: true, once: true });
    document.addEventListener('click', warmAudio, { capture: true, once: true });

    document.addEventListener('click',(e)=>{
        if(!inited && t.length) initAudio();
        if(ac && ac.state === 'suspended') ac.resume();
    });
}();
</script>
<script>
// ===== 开场：星夜回忆 =====
(function () {
    var intro = document.getElementById('intro');
    if (!intro) return;

    var INTRO_KEY = 'ksx_intro_seen_at';
    var INTRO_TTL = 15 * 24 * 60 * 60 * 1000; // 15 天(毫秒)
    var lastSeen = 0;
    try { lastSeen = parseInt(localStorage.getItem(INTRO_KEY) || '0', 10) || 0; } catch (e) {}
    if (lastSeen && (Date.now() - lastSeen) < INTRO_TTL) {
        intro.remove();
        document.body.classList.remove('intro-lock');
        return;
    }
    try { localStorage.setItem(INTRO_KEY, String(Date.now())); } catch (e) {}

    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
    window.addEventListener('pageshow', function () { window.scrollTo(0, 0); }, { passive: true });

    var t0 = Date.now();
    document.body.classList.add('intro-lock');

    // 星空：canvas 绘制圆形柔光星点，缓慢呼吸（非方块）
    var sky = document.getElementById('introSky');
    var ctx = sky ? sky.getContext('2d') : null;
    var stars = [];
    var raf = 0;
    var W = 0, H = 0;

    function buildSky() {
        if (!ctx) return;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        sky.width = Math.round(W * dpr);
        sky.height = Math.round(H * dpr);
        sky.style.width = W + 'px';
        sky.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var count = Math.min(150, Math.max(60, Math.round(W * H / 16000)));
        stars = [];
        for (var i = 0; i < count; i++) {
            var big = Math.random() < 0.13;
            var warm = Math.random() < 0.16;
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H * 0.9,
                r: big ? (1.3 + Math.random() * 1.5) : (0.35 + Math.random() * 0.95),
                warm: warm,
                sp: 0.4 + Math.random() * 1.1,
                ph: Math.random() * Math.PI * 2
            });
        }
    }

    function drawSky(ts) {
        if (!ctx) return;
        ctx.clearRect(0, 0, W, H);
        var t = ts || 0;
        for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            var b = 0.6 + 0.4 * Math.sin(t * 0.001 * s.sp * 6.283 + s.ph);
            var r = s.r * 6.5;
            var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
            if (s.warm) {
                g.addColorStop(0, 'rgba(255,242,218,' + (0.85 * b).toFixed(3) + ')');
                g.addColorStop(0.28, 'rgba(255,218,160,' + (0.26 * b).toFixed(3) + ')');
            } else {
                g.addColorStop(0, 'rgba(255,255,255,' + (0.92 * b).toFixed(3) + ')');
                g.addColorStop(0.28, 'rgba(208,225,255,' + (0.3 * b).toFixed(3) + ')');
            }
            g.addColorStop(1, 'rgba(190,210,255,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(s.x, s.y, r, 0, 6.283);
            ctx.fill();
        }
        raf = requestAnimationFrame(drawSky);
    }

    function startSky() {
        if (!ctx) return;
        buildSky();
        raf = requestAnimationFrame(drawSky);
    }
    window.addEventListener('resize', function () { if (ctx) buildSky(); });
    startSky();

    function close() {
        if (!intro.isConnected) return;
        cancelAnimationFrame(raf);
        intro.classList.add('out');
        document.body.classList.remove('intro-lock');
        window.scrollTo(0, 0);
        setTimeout(function () { intro.remove(); }, 680);
    }
    document.addEventListener('click', function (e) {
        if (!intro.isConnected) return;
        if (!e.target.closest('#intro')) return;
        if (Date.now() - t0 < 4600) return;
        e.stopImmediatePropagation();
        e.preventDefault();
        close();
    }, true);
})();
</script>


<script>
(function () {
    /* 特效由后台「插件」页开关控制（CFG.fx）；本页在 template/ 下，相对上一级取 js/ */
    var fxFiles = (typeof CFG !== 'undefined' && CFG.fx && CFG.fx.length)
        ? CFG.fx.map(function (p) { return '../' + p; })
        : [];
    var loaded = false;
    function injectSrc(src) {
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        document.body.appendChild(s);
    }
    function injectCode(code) {
        var url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
        var s = document.createElement('script');
        s.src = url;
        s.async = false;
        s.onload = s.onerror = function () { URL.revokeObjectURL(url); };
        document.body.appendChild(s);
    }
    function fetchText(src) {
        return fetch(src, { cache: 'force-cache' })
            .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
            .catch(function () { return null; });
    }
    function loadFx() {
        if (loaded) return;
        loaded = true;
        var jobs = [], i;
        for (i = 0; i < fxFiles.length; i++) {
            if (/^https?:/i.test(fxFiles[i])) jobs.push(fetchText(fxFiles[i]));
            else injectSrc(fxFiles[i]);
        }
        Promise.all(jobs).then(function (codes) {
            for (var k = 0; k < codes.length; k++) {
                if (codes[k]) injectCode(codes[k]);
            }
        });
    }
    function boot() {
        if ('requestIdleCallback' in window) {
            window.requestIdleCallback(loadFx, { timeout: 2000 });
        } else {
            setTimeout(loadFx, 300);
        }
    }
    if (document.readyState === 'complete') {
        boot();
    } else {
        window.addEventListener('load', boot, { once: true });
    }
})();
</script>
