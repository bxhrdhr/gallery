.img-wrap {
    aspect-ratio: 3/4;
    position: relative;
    border-radius: 3px;
    overflow: hidden;
    background: rgba(18, 24, 36, 0.32);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    contain: content;
}
/* 仅在交互(悬停放大)时提升合成层，避免全列表常驻 80+ 合成层 */
.img-wrap.loaded:hover {
    will-change: transform, filter;
}

.img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    position: absolute;
    inset: 0;
    transition: opacity 0.6s ease;
    cursor: pointer; 
    transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1), filter 0.6s ease, opacity 0.6s ease;
    filter: brightness(0.9) contrast(0.95) saturate(0.9);
    backface-visibility: hidden;
    z-index: 1;
    transform: translateZ(0);
}

.img-wrap.loaded img {
    opacity: 1;
}

.img-wrap.loaded:hover img {
    transform: scale(1.04);
    filter: brightness(1.05) contrast(1.05) saturate(1.05);
}

img:not([src]), img[src=""], img:-moz-broken {
    opacity: 0 !important;
    visibility: hidden;
}

.status-icon {
    position: relative;
    width: 16px;
    height: 16px;
    color: #606060;
    z-index: 2;
    transition: opacity 0.3s ease;
}

.img-wrap:not(.error) .status-icon {
    animation: rotate 1.2s linear infinite;
}

.img-wrap.error .status-icon {
    color: #606060;
    animation: none;
}

.img-wrap.loaded .status-icon {
    opacity: 0;
    pointer-events: none;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    cursor: pointer; transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1), filter 0.6s ease;
    filter: brightness(0.9) contrast(0.95) saturate(0.9);
}
.noise {
    transform: translateZ(0);
}

#v {

@keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

.t {

    max-width: 620px;
    margin: 30px auto 0;
    padding: 10px 20px 84px;
    text-align: center;
}
.t-inner {
    position: relative;
    padding: 32px 24px 30px;
    border-radius: 20px;
    background:
        radial-gradient(120% 100% at 50% 0%, rgba(150, 178, 235, 0.07), transparent 58%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01) 50%, rgba(255, 255, 255, 0.02));
    border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow: 0 22px 54px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.04);
}
/* 时间线：两个时间节点 */
.t-tl {
    position: relative;
    padding-left: 34px;
    text-align: left;
}
.t-tl::before {
    content: '';
    position: absolute;
    left: 10px;
    top: 6px;
    bottom: 10px;
    width: 1px;
    background: linear-gradient(180deg, rgba(235, 210, 150, 0.55), rgba(235, 210, 150, 0.1));
}
.t-row { position: relative; }
.t-row + .t-row { margin-top: 18px; }
.t-dot {
    position: absolute;
    left: -28px;
    top: 7px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e7cf96;
    box-shadow: 0 0 10px rgba(231, 207, 150, 0.9);
}
.t-cell { display: block; }

}

    text-shadow: 0 0 18px rgba(255, 220, 160, 0.16);
    font-variant-numeric: tabular-nums;
}
/* 分隔 */
.t-rule {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 24px auto 22px;
    max-width: 240px;
}
.t-rule::before,
.t-rule::after {
    content: '';
    height: 1px;
    flex: 1;
}
.t-rule::before { background: linear-gradient(90deg, transparent, rgba(235, 210, 150, 0.45)); }
.t-rule::after  { background: linear-gradient(90deg, rgba(235, 210, 150, 0.45), transparent); }
.t-rule i {
    width: 5px;
    height: 5px;
    transform: rotate(45deg);
    background: rgba(235, 210, 150, 0.8);
    box-shadow: 0 0 8px rgba(235, 210, 150, 0.5);
}

<script>
!function(){
    /* 文案与时光图库同步：标题/开场文字全部读 CFG（后台保存即同步） */
    document.title = CFG.name + (CFG.uiSub && CFG.uiSub !== CFG.name ? ' · ' + CFG.uiSub : '');

    var _l1 = document.querySelector('.i-line:nth-child(1)'); if (_l1) _l1.textContent = CFG.hero.title;
    var _l2 = document.querySelector('.i-line:nth-child(2)'); if (_l2) _l2.textContent = CFG.hero.sub;

    var _ic = document.querySelector('.intro-cta'); if (_ic) _ic.textContent = CFG.hero.cta;
    var _md = document.querySelector('meta[name="description"]'); if (_md) _md.setAttribute('content', CFG.intro);

    /* 内容与时光图库页面同步：图片/分类/音乐/文字全部来自同一份 CFG（后台保存时同步） */
    const musicFiles = (CFG.musics || []).map(function (m) { return m.f; });
    const musicNames = (CFG.musics || []).map(function (m) { return m.name || m.f; });

    /* 已禁用的图片（后台「素材库」）不在旧站风格页展示 */
    const rawImageFiles = (CFG.imgs || []).filter(function (it) { return !it.disabled; }).map(function (it) { return it.f; });
    const rawImageCats = (CFG.imgs || []).filter(function (it) { return !it.disabled; }).map(function (it) { return it.c || ''; });





    let imageFiles = rawImageFiles.slice();

    /* ---- 分类：优先用时光图库后台的分类（内容同步）；无分类时按文件名自动分组 ---- */
    let curCat = 'all';
    function hasCfgCats() { return CFG.cats && CFG.cats.length > 1; }
    function catOf(n, i) {
        if (hasCfgCats() && rawImageCats[i]) return rawImageCats[i];
        var m = n.match(/^([\u4e00-\u9fa5A-Za-z]{2,})[_\-.\s]/);
        return m ? m[1] : '其他';
    }
    function catNameOf(catId) {
        if (!hasCfgCats()) return catId;
        for (var i = 0; i < CFG.cats.length; i++) if (CFG.cats[i].id === catId) return CFG.cats[i].name;
        return catId;
    }
    function catMenuEl() { return document.getElementById('catMenu'); }
    function closeCatMenu() {
        var cm = catMenuEl();
        if (cm && cm.style.display === 'flex') {

        }
    }
    function openCatMenu() {
        var cm = catMenuEl();
        if (!cm) return;
        renderCatMenu();
        cm.style.display = 'flex';
        requestAnimationFrame(function () { cm.classList.add('show'); });
    }
    function renderCatMenu() {
        var cm = catMenuEl();
        if (!cm) return;
        cm.innerHTML = '';
        /* 分类分区 */
        var hd = document.createElement('div');
        hd.className = 'mi mi-hd';
        hd.textContent = '分类';
        cm.appendChild(hd);
        var cats;
        if (hasCfgCats()) {
            cats = CFG.cats.map(function (c) { return { id: c.id, name: c.name }; });
        } else {
            var seen = ['all'];
            cats = [{ id: 'all', name: '全部' }];
            rawImageFiles.forEach(function (n, i) {
                var c2 = catOf(n, i);
                if (seen.indexOf(c2) === -1) { seen.push(c2); cats.push({ id: c2, name: c2 }); }
            });
        }
        cats.forEach(function (cc) {
            var b = document.createElement('button');
            b.className = 'mi' + (cc.id === curCat ? ' act' : '');
            b.textContent = cc.name;
            b.type = 'button';
            b.onclick = function () {
                curCat = cc.id;
                imageFiles = [];
                for (var i = 0; i < rawImageFiles.length; i++) {
                    if (curCat === 'all' || catOf(rawImageFiles[i], i) === curCat) imageFiles.push(rawImageFiles[i]);
                }
                var container = document.getElementById('c');
                container.innerHTML = '';
                renderAllPerfectly();
                if (v) { v.style.display = 'none'; document.body.style.overflow = ''; }
                closeCatMenu();
                renderCatMenu();
            };
            cm.appendChild(b);
        });
        /* 音乐分区 */
        if (musicFiles.length && t.length) {
            var hd2 = document.createElement('div');
            hd2.className = 'mi mi-hd';
            hd2.textContent = '音乐';
            cm.appendChild(hd2);
            t.forEach(function (s, i) {
                var d = document.createElement('div');
                d.className = 'mi' + (i === c ? ' act' : '');
                d.setAttribute('data-music', '1');
                d.textContent = s.n;
                d.onclick = function () { ld(i); closeCatMenu(); };
                cm.appendChild(d);
            });
        }
    }

    
    

    let t=[],c=0,ia=!1,mp=!1;
    const b=document.getElementById('b'),
          q=document.getElementById('p'),
          n=document.getElementById('n'),
          u=document.getElementById('a'),
          lb=document.getElementById('l'),
          ct=document.getElementById('c'),
          ls=document.getElementById('list'),
          ml=document.getElementById('ml'),
          cvs=document.getElementById('cvs'),
          v=document.getElementById('v'),
          pi=document.getElementById('pi');

    let ac, an, src, ctx, gr;
    let inited = false;

    function initAudio() {
        if(inited) return;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if(!AC) return;
            ac = new AC();
            an = ac.createAnalyser();
            an.fftSize = 128;
            an.smoothingTimeConstant = 0.85;
            src = ac.createMediaElementSource(u);
            src.connect(an);
            an.connect(ac.destination);
            ctx = cvs.getContext('2d', { alpha: true });
            resize();
            window.addEventListener('resize', resize);
            inited = true;
            if('mediaSession' in navigator){
                navigator.mediaSession.setActionHandler('play', () => u.play());
                navigator.mediaSession.setActionHandler('pause', () => u.pause());
                navigator.mediaSession.setActionHandler('previoustrack', () => ld(c-1));
                navigator.mediaSession.setActionHandler('nexttrack', () => ld(c+1));
            }
            render();
        } catch(e) { console.log(e); }
    }

    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cvs.width = cvs.offsetWidth * dpr;
        cvs.height = cvs.offsetHeight * dpr;
        if(ctx) {
            ctx.scale(dpr, dpr);
            gr = ctx.createLinearGradient(0, cvs.offsetHeight, 0, 0);
            gr.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
            gr.addColorStop(0.4, 'rgba(212, 175, 55, 0.3)');
            gr.addColorStop(1, 'rgba(212, 175, 55, 0)');
            
            ctx.shadowBlur = 4;
            ctx.shadowColor = 'rgba(212, 175, 55, 0.4)';
        }
    }

    function render() {
        if(!inited) return;
        requestAnimationFrame(render);
        const w = cvs.offsetWidth;
        const h = cvs.offsetHeight;
        ctx.clearRect(0, 0, w, h);
        if(u.paused) return;
        
        const len = an.frequencyBinCount;
        const da = new Uint8Array(len);
        an.getByteFrequencyData(da);
        
        const bars = 48;
        const step = Math.floor(len * 0.8 / bars);
        const gap = w / bars;
        const bw = gap * 0.4;
        
        ctx.fillStyle = gr;
        ctx.beginPath();
        
        for(let i = 0; i < bars; i++) {
            let sum = 0;
            for(let j = 0; j < step; j++) {
                sum += da[i * step + j];
            }
            const avg = sum / step;
            const val = (Math.pow(avg / 255, 1.5)) * h * 0.4;
            
            const x = i * gap + gap/2 + 12;
            const y = h - val;
            
            ctx.roundRect(x - bw/2, y, bw, val + 2, 4);
        }
        ctx.fill();
    }

    function setIcon(p) {
        pi.innerHTML = p 
            ? '<rect x="7" y="6" width="3" height="12" rx="1.5"/><rect x="14" y="6" width="3" height="12" rx="1.5"/>'

    const upd=()=>{
        Array.from(document.querySelectorAll('#catMenu [data-music]')).forEach((el,i)=>{
            el.className = i===c ? 'mi act' : 'mi';
        });
        if(t[c] && 'mediaSession' in navigator){

                title: t[c].n, artist: 'KSX ZH',

  src: ASSET_BASE + 'logo/favicon.ico', 
  sizes: '192x192', 
  type: 'image/x-icon' 
}]

            });
            navigator.mediaSession.playbackState = "playing";
        }
    };

    u.onplay = () => {
        setIcon(true);
        ia = true;
        if(!inited) initAudio();
        if(ac && ac.state === 'suspended') ac.resume();
        upd();
    };

    u.onpause = () => { setIcon(false); };

    const pp=()=>{
        if(!t.length)return;
        if(!inited) initAudio();
        if(u.paused){ mp=!1; u.play(); } else { mp=!0; u.pause(); }
    };
    
    let swp = false;
    const ld = (i) => {
        if(!t.length) return;
        swp = true;
        c = (i + t.length) % t.length;
        if(!inited) initAudio();
        u.src = t[c].u;
        u.load();
        mp = false;
        let p = u.play();
        if(p !== undefined) p.catch(()=>{});
        setTimeout(() => { swp = false; }, 1000);
    };

    u.onended = () => { 
        if(!swp) ld(c+1); 
    };

    u.ontimeupdate = () => {
        if(u.duration > 0 && u.duration - u.currentTime <= 0.4 && !swp) {
            ld(c+1);
        }
    };

    if(musicFiles.length) {
        t = musicFiles.map((f, mi) => ({
            u: ASSET_BASE + f,
            n: musicNames[mi] || f.replace(/\.mp3$/i, '').replace(/[^\u4e00-\u9fa5]/g,'') || f.replace(/\.mp3$/i, '')
        }));
        
        u.src = t[0].u; 
        if('mediaSession' in navigator){
            navigator.mediaSession.metadata = new MediaMetadata({
                title: t[0].n, artist: 'KSX ZH',
                artwork: [{ 
  src: ASSET_BASE + 'logo/favicon.ico', 
  sizes: '192x192', 
  type: 'image/x-icon' 
}]
            });
        }
    }

    window.addEventListener('popstate', () => {
        v.style.display = 'none';
        document.body.style.overflow = '';
    });

    const closeViewer = (e) => {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        if(v.style.display !== 'none') {
            history.back();
        }
    };

    const extStyle = document.createElement('style');
    extStyle.textContent = `
        @keyframes slideNext { 
            0% { transform: translateY(15px); } 
            100% { transform: translateY(0); } 
        }
        @keyframes slidePrev { 
            0% { transform: translateY(-15px); } 
            100% { transform: translateY(0); } 
        }
        @keyframes softZoom { 
            0% { transform: scale(0.98); } 
            100% { transform: scale(1); } 
        }
    `;
    document.head.appendChild(extStyle);

    let currentImgIndex = -1;
    let imgToken = 0;
    let vImg = v.querySelector('img');
    if (!vImg) {
        vImg = document.createElement('img');
        v.appendChild(vImg);
    }

    const origQueue = [];

        if (origRunning || !origQueue.length) return;

            if (!origQueue.length) { origRunning = false; return; }
            const src = origQueue.shift();
            const im = new Image();
            im.decoding = 'async';
            im.fetchPriority = 'low';
            const done = () => {
                if ('requestIdleCallback' in window) window.requestIdleCallback(step, { timeout: 1000 });

            };
            im.onload = done; im.onerror = done;
            im.src = src;
        };
        step();
    };

 const renderAllPerfectly = () => {

<script>
// ===== 开场：星夜回忆 =====
(function () {
    var intro = document.getElementById('intro');
    if (!intro) return;

    var INTRO_KEY = 'ksx_intro_seen_at';
    var INTRO_TTL = 15 * 24 * 60 * 60 * 1000; // 15 天(毫秒)
    var lastSeen = 0;
    try { lastSeen = parseInt(localStorage.getItem(INTRO_KEY) || '0', 10) || 0; } catch (e) {}
    if (lastSeen && (Date.now() - lastSeen) < INTRO_TTL) {
        intro.remove();
        document.body.classList.remove('intro-lock');
        return;
    }
    try { localStorage.setItem(INTRO_KEY, String(Date.now())); } catch (e) {}

    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
    window.addEventListener('pageshow', function () { window.scrollTo(0, 0); }, { passive: true });

    var t0 = Date.now();
    document.body.classList.add('intro-lock');

    // 星空：canvas 绘制圆形柔光星点，缓慢呼吸（非方块）
    var sky = document.getElementById('introSky');
    var ctx = sky ? sky.getContext('2d') : null;
    var stars = [];
    var raf = 0;
    var W = 0, H = 0;

    function buildSky() {
        if (!ctx) return;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        sky.width = Math.round(W * dpr);
        sky.height = Math.round(H * dpr);
        sky.style.width = W + 'px';
        sky.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var count = Math.min(150, Math.max(60, Math.round(W * H / 16000)));
        stars = [];
        for (var i = 0; i < count; i++) {
            var big = Math.random() < 0.13;
            var warm = Math.random() < 0.16;
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H * 0.9,
                r: big ? (1.3 + Math.random() * 1.5) : (0.35 + Math.random() * 0.95),
                warm: warm,
                sp: 0.4 + Math.random() * 1.1,
                ph: Math.random() * Math.PI * 2
            });
        }
    }

    function drawSky(ts) {
        if (!ctx) return;
        ctx.clearRect(0, 0, W, H);
        var t = ts || 0;
        for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            var b = 0.6 + 0.4 * Math.sin(t * 0.001 * s.sp * 6.283 + s.ph);
            var r = s.r * 6.5;
            var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
            if (s.warm) {
                g.addColorStop(0, 'rgba(255,242,218,' + (0.85 * b).toFixed(3) + ')');
                g.addColorStop(0.28, 'rgba(255,218,160,' + (0.26 * b).toFixed(3) + ')');
            } else {
                g.addColorStop(0, 'rgba(255,255,255,' + (0.92 * b).toFixed(3) + ')');
                g.addColorStop(0.28, 'rgba(208,225,255,' + (0.3 * b).toFixed(3) + ')');
            }
            g.addColorStop(1, 'rgba(190,210,255,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(s.x, s.y, r, 0, 6.283);
            ctx.fill();
        }
        raf = requestAnimationFrame(drawSky);
    }

    function startSky() {
        if (!ctx) return;
        buildSky();
        raf = requestAnimationFrame(drawSky);
    }
    window.addEventListener('resize', function () { if (ctx) buildSky(); });
    startSky();

    function close() {
        if (!intro.isConnected) return;
        cancelAnimationFrame(raf);
        intro.classList.add('out');
        document.body.classList.remove('intro-lock');
        window.scrollTo(0, 0);
        setTimeout(function () { intro.remove(); }, 680);
    }
    document.addEventListener('click', function (e) {
        if (!intro.isConnected) return;
        if (!e.target.closest('#intro')) return;
        if (Date.now() - t0 < 4600) return;
        e.stopImmediatePropagation();
        e.preventDefault();
        close();
    }, true);
})();
</script>


<script>
(function () {
    var fxFiles = [
        './js/分手时间.js',
        './js/全屏/樱花特效.js',
        './js/点击/水波纹点击特效.js',
        './js/图片/图片呼吸特效.js',
        './js/全屏/雨落特效.js',
        './js/全屏/飞雪特效.js',
        './js/图片/滤镜特效.js'
    ];
    var loaded = false;
    function injectSrc(src) {
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        document.body.appendChild(s);
    }
    function injectCode(code) {
        var url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
        var s = document.createElement('script');
        s.src = url;
        s.async = false;
        s.onload = s.onerror = function () { URL.revokeObjectURL(url); };
        document.body.appendChild(s);
    }
    function fetchText(src) {
        return fetch(src, { cache: 'force-cache' })
            .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
            .catch(function () { return null; });
    }
    function loadFx() {
        if (loaded) return;
        loaded = true;
        var jobs = [], i;
        for (i = 0; i < fxFiles.length; i++) {
            if (/^https?:/i.test(fxFiles[i])) jobs.push(fetchText(fxFiles[i]));
            else injectSrc(fxFiles[i]);
        }
        Promise.all(jobs).then(function (codes) {
            for (var k = 0; k < codes.length; k++) {
                if (codes[k]) injectCode(codes[k]);
            }
        });
    }
    function boot() {
        if ('requestIdleCallback' in window) {
            window.requestIdleCallback(loadFx, { timeout: 2000 });
        } else {
            setTimeout(loadFx, 300);
        }
    }
    if (document.readyState === 'complete') {
        boot();
    } else {
        window.addEventListener('load', boot, { once: true });
    }
})();
</script>
