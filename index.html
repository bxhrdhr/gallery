<meta charset="UTF-8">

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
html { margin: 0; }
body { margin: 0; min-height: 100vh; }
body {
    font-family: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
    color: var(--ink);
    background: var(--bg-0);
    transition: background .5s ease;
    overflow-x: hidden;
}
/* ============ 主题（内置渐变背景） ============ */
body[data-bg="cream"]  { --bg-0: linear-gradient(165deg,#fdf8f0 0%,#f5ead9 55%,#efe0c8 100%); --ink:#3d3a35; --ink2:#8a8377; --card:rgba(255,255,255,.72); --line:rgba(160,130,90,.25); --accent:#e07a5f; --accent2:#d4a373; --chip:#fff; }
body[data-bg="forest"] { --bg-0: linear-gradient(165deg,#24402e 0%,#1a3223 55%,#0c1a11 100%); --ink:#f2ead9; --ink2:#b7c7b4; --card:rgba(30,52,38,.72); --line:rgba(210,230,200,.2); --accent:#a3c9a0; --accent2:#7ea884; --chip:#16291c; }
body[data-bg="night"]  { --bg-0: linear-gradient(165deg,#232a4d 0%,#181d36 55%,#0b0d1d 100%); --ink:#ececf5; --ink2:#a9adcf; --card:rgba(28,32,60,.72); --line:rgba(170,175,220,.2); --accent:#8f9bff; --accent2:#6d7ae0; --chip:#171b30; }
body[data-bg="sakura"] { --bg-0: linear-gradient(165deg,#fff7f6 0%,#fde8e6 55%,#fbdcd6 100%); --ink:#5c4743; --ink2:#b08f88; --card:rgba(255,255,255,.78); --line:rgba(210,150,140,.28); --accent:#e58d7f; --accent2:#efb8a8; --chip:#fff; }
body[data-bg="aurora"] { --bg-0: linear-gradient(165deg,#0d3f46 0%,#0a2f38 55%,#071c24 100%); --ink:#e3f2ef; --ink2:#8fb8b4; --card:rgba(12,44,52,.74); --line:rgba(150,220,210,.22); --accent:#67d6c4; --accent2:#3aa89a; --chip:#0c262e; }
/* 图片背景（含 GIF） */
body.img-bg { --ink:#f6f2ea; --ink2:#cfc8bb; --card:rgba(0,0,0,.4); --line:rgba(255,255,255,.22); --accent:#f0b08a; --accent2:#e09a6f; --chip:rgba(0,0,0,.34); }

.bg-layer { position: fixed; inset: 0; z-index: -2; background-size: cover; background-position: center center; background-repeat: no-repeat; }
.bg-dim { position: fixed; inset: 0; z-index: -1; background: transparent; }

.hidden { display: none !important; }
a, button { -webkit-tap-highlight-color: transparent; }

/* ============ 首页 ============ */
#home { min-height: 100dvh; display: flex; flex-direction: column; }
.brand {
    display: flex; align-items: baseline; gap: 10px;
    padding: 22px 22px 0; letter-spacing: .14em;
}
.brand b { font-size: 17px; font-weight: 700; color: var(--ink); }
.brand span { font-size: 11px; color: var(--ink2); letter-spacing: .3em; }
.hero {
    flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 30px 24px 60px;
}
.eyebrow { font-size: 12px; color: var(--accent); letter-spacing: .42em; text-indent: .42em; margin: 0 0 18px; }
.hero h1 { font-size: 42px; margin: 0 0 14px; font-weight: 800; letter-spacing: .1em; color: var(--ink); }
.hero .sub { font-size: 14px; color: var(--ink2); letter-spacing: .18em; margin: 0 0 40px; line-height: 2; }
.cta {
    border: none; cursor: pointer; font-family: inherit;
    padding: 16px 58px; border-radius: 999px;
    font-size: 15px; letter-spacing: .3em; text-indent: .3em; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 14px 34px rgba(0,0,0,.16);
    transition: transform .25s ease;
}
.cta:active { transform: scale(.95); }
#home.leave { opacity: 0; transform: scale(1.04); pointer-events: none; }
#home { transition: opacity .35s ease, transform .35s ease; }

/* ============ 转场幕布 ============ */
#curtain {
    position: fixed; inset: 0; z-index: 90; pointer-events: none;
    background: var(--bg-0); opacity: 0; transform: scaleY(0); transform-origin: center;
}
#curtain.play { animation: curtain .5s cubic-bezier(.76,0,.24,1) forwards; }
@keyframes curtain {
    0%   { transform: scaleY(0);   opacity: 0; }
    38%  { transform: scaleY(1);   opacity: 1; }
    62%  { transform: scaleY(1);   opacity: 1; }
    100% { transform: scaleY(0);   opacity: 0; }
}

/* ============ 相册页 ============ */
#album { min-height: 100dvh; padding: 18px 16px 96px; display: flex; flex-direction: column; }
#album.enter { animation: albumIn .35s ease-out both; }
@keyframes albumIn { from { opacity: 0; } to { opacity: 1; } }
.album-head { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.ah-row { display: flex; align-items: center; gap: 10px; width: 100%; }
.back {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    width: 40px; height: 40px; border-radius: 12px; font-size: 16px; cursor: pointer;
    flex: none;
}
.album-title { font-size: 15px; font-weight: 700; letter-spacing: .14em; color: var(--ink); flex: none; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* ============ 标题行长条播放器 ============ */
.hbar {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
    height: 38px; border-radius: 19px; padding: 0 6px 0 4px;
    background: rgba(0,0,0,.55);
    box-shadow: 0 4px 14px rgba(0,0,0,.16);
}
.hb-play, .hb-next {
    flex: none; width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg,#ff9ec5,#f272a6); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(242,114,166,.45);
}
.hb-play svg { width: 16px; height: 16px; }
.hb-next { background: rgba(255,255,255,.14); box-shadow: none; width: 26px; height: 26px; }
.hb-next svg { width: 14px; height: 14px; }
.hb-mid { flex: 1; min-width: 0; }
.hb-name { font-size: 11px; color: #fff; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.hb-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; cursor: pointer; }
.hb-bar i { display: block; height: 100%; width: 0; border-radius: 2px; background: linear-gradient(90deg,#ff9ec5,#f272a6); }
.cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; width: 100%; padding: 4px 0; }
.cats::-webkit-scrollbar { display: none; }
.cat {
    flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink2);
    padding: 8px 18px; border-radius: 999px; font-size: 12px; letter-spacing: .14em;
    cursor: pointer;
    transition: all .25s ease;
}
.cat.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; }

/* 大图区 */
.stage {
    position: relative; width: 100%; height: 46dvh; border-radius: 20px; overflow: hidden;
    background: var(--card);
    box-shadow: 0 18px 44px rgba(0,0,0,.14);
}
.stage-main { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: zoom-in; }
#stageImg { width: 100%; height: 100%; object-fit: cover; display: block; }
.stage-cap {
    position: absolute; left: 12px; right: 12px; bottom: 12px;
    display: flex; align-items: center; gap: 10px;
    background: rgba(0,0,0,.55);
    border-radius: 12px; padding: 10px 14px;
}
.stage-cap b { color: #fff; font-size: 14px; letter-spacing: .1em; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage-cap span { color: rgba(255,255,255,.8); font-size: 11px; letter-spacing: .14em; flex: none; }
.stage-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(0,0,0,.35); color: #fff; font-size: 16px;
}
.stage-nav.prev { left: 10px; } .stage-nav.next { right: 10px; }

/* 小图区 */
.film-title { font-size: 12px; color: var(--ink2); letter-spacing: .2em; margin: 18px 0 10px; }
.film { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px; }
.thumb {
    position: relative; border-radius: 14px; overflow: hidden; cursor: pointer;
    aspect-ratio: 3 / 4; background: var(--card);
    border: 2px solid transparent; transition: border-color .2s ease, transform .2s ease;
}
.thumb.on { border-color: var(--accent); transform: translateY(-2px); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .tname {
    position: absolute; left: 0; right: 0; bottom: 0;
    font-size: 10px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.55));
    padding: 14px 8px 6px; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.thumb.empty { display: flex; align-items: center; justify-content: center; color: var(--ink2); font-size: 12px; border: 1px dashed var(--line); aspect-ratio: auto; min-height: 90px; }


/* ============ 灯箱 ============ */
.lb {
    position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.88);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
}
.lb.show { opacity: 1; pointer-events: auto; }
.lb img { max-width: 92vw; max-height: 84vh; border-radius: 12px; }
.lb .lb-prev, .lb .lb-next { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,.16); color: #fff; font-size: 18px; cursor: pointer; }
.lb .lb-prev { left: 14px; } .lb .lb-next { right: 14px; }
.lb .lb-name { position: absolute; bottom: 26px; left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; letter-spacing: .14em; }
/* 大图与放大图去掉左右箭头，改用滑动切换（触屏滑动 / 鼠标拖拽均可） */
.stage-nav, .lb .lb-prev, .lb .lb-next { display: none !important; }
#stageMain { touch-action: pan-y; }
#lb { touch-action: none; }
/* ============ 双端适配：手机/电脑 ============ */
@media (min-width: 768px) {
    #album { max-width: 1100px; margin: 0 auto; padding: 26px 28px 120px; }
    .stage { height: 62vh; }
    .film { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .thumb { border-radius: 16px; }
    .hbar { height: 44px; }
    .hb-name { font-size: 12px; }
    .hero h1 { font-size: 56px; }
    .eyebrow { font-size: 14px; }
    .brand b { font-size: 20px; }
    .album-head { gap: 14px; }
    .film-title { font-size: 14px; }
}
</style>

var ASSET_BASE = '';
if (ASSET_BASE && ASSET_BASE.slice(-1) !== '/') ASSET_BASE += '/';
/* 图片双通道加速：gh-proxy（参考站同款加速）+ 失败自动回退本站域名 */
var GHP = 'https://gh-proxy.org/https://raw.githubusercontent.com/bxhrdhr/gallery/main/';
function px(u) { return GHP + u; }
function pxFallback(el) { if (el.src.indexOf(GHP) === 0) { el.src = el.src.slice(GHP.length); return true; } return false; }
function webpFallback() { return false; }  /* jpg 重复文件已删除，不再回退 */

/* ---------- 特效：读取后台「插件」页开关（CFG.fx）加载对应特效 ---------- */

var C = CFG, bgs = C.bgs || [], curCat = 'all', curIdx = 0, list = [], bgTimer = null, bgIdx = 0;

/* ---------- 标题与文案 ---------- */
document.title = C.name + (C.uiSub && C.uiSub !== C.name ? ' · ' + C.uiSub : '');

/* ---------- 背景 ---------- */
function applyBg(id) {
    var b = null;
    for (var i = 0; i < bgs.length; i++) if (bgs[i].id === id) { b = bgs[i]; break; }
    if (!b) return;
    var layer = document.getElementById('bgLayer');
    var dim = document.querySelector('.bg-dim');
    if (b.type === 'img') {
        document.body.classList.add('img-bg');
        layer.style.backgroundImage = 'url(' + ASSET_BASE + b.url + ')';
        dim.style.background = 'rgba(0,0,0,.38)';
    } else {
        document.body.classList.remove('img-bg');
        layer.style.backgroundImage = '';
        dim.style.background = 'transparent';
        document.body.setAttribute('data-bg', b.id);
    }
}
function startBgAuto() {
    stopBgAuto();
    if (!C.bgAuto || bgs.length < 2) return;
    var start = 0;
    for (var i = 0; i < bgs.length; i++) if (bgs[i].id === C.bg) { start = i; break; }
    bgIdx = start;
    bgTimer = setInterval(function () {
        bgIdx = (bgIdx + 1) % bgs.length;
        applyBg(bgs[bgIdx].id);
    }, (C.bgAutoSec || 8) * 1000);
}
function stopBgAuto() { if (bgTimer) { clearInterval(bgTimer); bgTimer = null; } }
applyBg(C.bg);
startBgAuto();

/* ---------- 分类 ---------- */
var catBar = document.getElementById('catBar');
function renderCats() {
    catBar.innerHTML = '';
    C.cats.forEach(function (c) {
        var b = document.createElement('button');
        b.className = 'cat' + (curCat === c.id ? ' on' : '');
        b.textContent = c.name;
        b.type = 'button';
        b.onclick = function () { curCat = c.id; renderCats(); renderFilm(); renderStage(); };
        catBar.appendChild(b);
    });
}

/* ---------- 相册（大图 + 小图） ---------- */
function curList() {
    /* 已禁用的图片（后台「素材库」）不展示 */
    if (curCat === 'all') return C.imgs.filter(function (it) { return !it.disabled; });
    return C.imgs.filter(function (it) { return !it.disabled && it.c === curCat; });
}
function catName(id) {
    for (var i = 0; i < C.cats.length; i++) if (C.cats[i].id === id) return C.cats[i].name;
    return '';
}
function renderStage() {
    list = curList();
    if (!list.length) {
        document.getElementById('stageImg').removeAttribute('src');
        document.getElementById('stageName').textContent = '这个分类还没有照片';
        document.getElementById('stageCat').textContent = '';
        document.getElementById('stagePrev').style.display = 'none';
        document.getElementById('stageNext').style.display = 'none';
        return;
    }
    if (curIdx >= list.length) curIdx = list.length - 1;
    if (curIdx < 0) curIdx = 0;
    var it = list[curIdx];
    var sImg = document.getElementById('stageImg');
    sImg.style.opacity = '0';
    sImg.dataset.req = Date.now();
    var req = sImg.dataset.req;
    var vv = (it._sha || '').slice(0, 8);
    /* 阶段1：先加载缩略图（小图快、不空白），加载成功淡入显示 */
    sImg.onload = function () {
        if (sImg.dataset.req !== req) return;
        if (!sImg.naturalWidth || !sImg.naturalHeight) { sImg.onerror(new Event('error')); return; }
        sImg.style.transition = 'opacity .25s ease';
        sImg.style.opacity = '1';
    };
    sImg.onerror = function () {
        clearTimeout(sImg._t);
        if (sImg.dataset.req !== req) return;
        if (!sImg.dataset.rt2 && sImg.src.indexOf(GHP) === 0) {
            sImg.dataset.rt2 = '1';
            sImg.src = sImg.src.split('&t=')[0] + '&t=' + Date.now();
            sImg._t = setTimeout(function () { if (sImg.dataset.req === req && (!sImg.complete || !sImg.naturalWidth)) sImg.onerror(new Event('error')); }, 8000);
            return;
        }
        if (pxFallback(this)) { sImg._t = setTimeout(function () { if (sImg.dataset.req === req && (!sImg.complete || !sImg.naturalWidth)) sImg.onerror(new Event('error')); }, 8000); return; }
        if (this.src.indexOf('img/thumbs/') > -1) this.src = this.src.replace('img/thumbs/', 'img/');
    };
    sImg.src = px(ASSET_BASE + it.f.replace('img/', 'img/thumbs/')) + (vv ? '?v=' + vv : '');
    sImg._t = setTimeout(function () { if (sImg.dataset.req === req && (!sImg.complete || !sImg.naturalWidth)) sImg.onerror(new Event('error')); }, 8000);
    /* 阶段2：后台预载大图（原画质），成功后替换缩略图，画质升级 */
    var hd = new Image();
    hd.onload = function () {
        if (sImg.dataset.req !== req) return;
        if (!hd.naturalWidth || !hd.naturalHeight) return;
        sImg.onload = function () { if (sImg.dataset.req === req) { sImg.style.transition = 'opacity .25s ease'; sImg.style.opacity = '1'; } };
        sImg.src = hd.src;
    };
    hd.onerror = function () { /* 大图加载失败则保持缩略图显示，不空白 */ };
    hd.src = px(ASSET_BASE + it.f) + (vv ? '?v=' + vv : '');
    document.getElementById('stageName').textContent = it.t;
    document.getElementById('stageCat').textContent = catName(it.c);
    document.getElementById('stageDate').textContent = it.date ? '上传于 ' + it.date : '';
    document.getElementById('stagePrev').style.display = list.length > 1 ? '' : 'none';
    document.getElementById('stageNext').style.display = list.length > 1 ? '' : 'none';
    var pre = new Image();
    var pv = ((list[(curIdx + 1) % list.length]._sha) || '').slice(0, 8);
    pre.src = ASSET_BASE + list[(curIdx + 1) % list.length].f + (pv ? '?v=' + pv : '');
    var thumbs = document.querySelectorAll('.thumb');
    for (var i = 0; i < thumbs.length; i++) {
        thumbs[i].classList.toggle('on', i === curIdx);
        if (i === curIdx) thumbs[i].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
}
function renderFilm() {
    var grid = document.getElementById('filmGrid');
    grid.innerHTML = '';
    var l = curList();
    document.getElementById('filmTitle').textContent = (curCat === 'all' ? '全部照片' : catName(curCat) + '照片') + ' · ' + l.length + ' 张';
    if (!l.length) {
        var e = document.createElement('div');
        e.className = 'thumb empty';
        e.textContent = '还没有照片';
        grid.appendChild(e);
    }
    l.forEach(function (it, i) {
        var d = document.createElement('div');
        d.className = 'thumb' + (i === curIdx ? ' on' : '');
        var tv = (it._sha || '').slice(0, 8);
        var tf = it.f.replace('img/', 'img/thumbs/');
        d.innerHTML = '<img loading="lazy" src="' + px(ASSET_BASE + tf) + (tv ? '?v=' + tv : '') + '" alt="' + it.t + '"><div class="tname">' + it.t + '</div>';
        var _im = d.querySelector('img');
        _im.onload = function () { if (!_im.naturalWidth || !_im.naturalHeight) _im.onerror(new Event('error')); };
        _im.onerror = function () {
            clearTimeout(_im._t);
            if (!_im.dataset.rt2 && this.src.indexOf(GHP) === 0) {
                _im.dataset.rt2 = '1';
                this.src = this.src.split('&t=')[0] + '&t=' + Date.now();
                _im._t = setTimeout(function () { if (!_im.complete || !_im.naturalWidth) _im.onerror(new Event('error')); }, 8000);
                return;
            }
            if (pxFallback(this)) { _im._t = setTimeout(function () { if (!_im.complete || !_im.naturalWidth) _im.onerror(new Event('error')); }, 8000); return; }
            if (this.src.indexOf('img/thumbs/') > -1) this.src = this.src.replace('img/thumbs/', 'img/');
        };
        _im._t = setTimeout(function () { if (!_im.complete || !_im.naturalWidth) _im.onerror(new Event('error')); }, 8000);
        /* 预加载对应大图：浏览时后台拉好，点击放大秒开 */
        var _pl = new Image(); _pl.src = px(ASSET_BASE + it.f) + (tv ? '?v=' + tv : '');
        d.onclick = function () { curIdx = i; renderStage(); };
        grid.appendChild(d);
    });
}
document.getElementById('stagePrev').onclick = function () { if (list.length) { curIdx = (curIdx - 1 + list.length) % list.length; renderStage(); } };
document.getElementById('stageNext').onclick = function () { if (list.length) { curIdx = (curIdx + 1) % list.length; renderStage(); } };

/* ---------- 进入/返回（转场特效） ---------- */
var curtain = document.getElementById('curtain');
var home = document.getElementById('home');
var album = document.getElementById('album');
function enter() {
    /* 进入图库自动播放音乐（用户点击手势，可绕过浏览器自动播放限制） */
    if (mList.length) { if (!audio) loadM(); if (audio.paused) { audio.play().catch(function () {}); setPIco(true); } }
    curtain.classList.remove('play');
    void curtain.offsetWidth;
    curtain.classList.add('play');
    home.classList.add('leave');
    setTimeout(function () {
        home.classList.add('hidden');
        album.classList.remove('hidden');
        album.classList.add('enter');
        renderCats(); renderStage(); renderFilm();
        setTimeout(function () { album.classList.remove('enter'); }, 600);
    }, 430);
}
function goBack() {
    curtain.classList.remove('play');
    void curtain.offsetWidth;
    curtain.classList.add('play');
    album.classList.add('hidden');
    home.classList.remove('hidden');
    home.classList.remove('leave');
}
document.getElementById('btnEnter').onclick = enter;
document.getElementById('btnBack').onclick = goBack;
document.getElementById('btnEnter').addEventListener('keydown', function (e) { if (e.key === 'Enter') enter(); });

/* ---------- 灯箱 ---------- */
var lb = document.getElementById('lb');
function showLb() {
    if (!list.length) return;
    var it = list[curIdx];
    var _lb = document.getElementById('lbImg');
    var _v = (it._sha || '').slice(0, 8);
    _lb.src = px(ASSET_BASE + it.f.replace('img/', 'img/thumbs/')) + (_v ? '?v=' + _v : '');
    var _bi = new Image();
    _bi.onload = function () { _lb.src = px(ASSET_BASE + it.f) + (_v ? '?v=' + _v : ''); };
    _bi.onerror = function () { if (!_bi.dataset.fb) { _bi.dataset.fb = '1'; pxFallback(_bi); } };
    _bi.src = px(ASSET_BASE + it.f) + (_v ? '?v=' + _v : '');
    document.getElementById('lbName').textContent = it.t + (catName(it.c) ? ' · ' + catName(it.c) : '');
    lb.classList.add('show');
}
document.getElementById('lbPrev').onclick = function () { if (list.length) { curIdx = (curIdx - 1 + list.length) % list.length; showLb(); renderStage(); } };
document.getElementById('lbNext').onclick = function () { if (list.length) { curIdx = (curIdx + 1) % list.length; showLb(); renderStage(); } };
/* ---- 大图与放大图：滑动切图 / 点击关闭或放大（左右箭头已隐藏） ---- */
function bindSwipe(el, onPrev, onNext, onClick) {
    var sx = 0, sy = 0, sw = false, suppress = false;
    el.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; sw = false; suppress = false; });
    el.addEventListener('pointermove', function (e) {
        if (e.pointerType === 'mouse' && e.buttons === 0) return;
        var dx = e.clientX - sx, dy = e.clientY - sy;
        if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { sw = true; suppress = true; if (e.cancelable) e.preventDefault(); }
    });
    el.addEventListener('pointerup', function (e) {
        if (!sw) return;
        var dx = e.clientX - sx;
        if (Math.abs(dx) > 40) { if (dx < 0) { if (onNext) onNext(); } else { if (onPrev) onPrev(); } }
        sw = false;
        setTimeout(function () { suppress = false; }, 300);
    });
    el.addEventListener('click', function (e) {
        if (suppress) { e.stopImmediatePropagation(); e.preventDefault(); return; }
        if (onClick) onClick(e);
    });
}
bindSwipe(document.getElementById('stageMain'),
    function () { if (list.length) { curIdx = (curIdx - 1 + list.length) % list.length; renderStage(); } },
    function () { if (list.length) { curIdx = (curIdx + 1) % list.length; renderStage(); } },
    function () { if (list.length) showLb(); });
bindSwipe(document.getElementById('lb'),
    function () { if (list.length) { curIdx = (curIdx - 1 + list.length) % list.length; showLb(); renderStage(); } },
    function () { if (list.length) { curIdx = (curIdx + 1) % list.length; showLb(); renderStage(); } },
    function (e) { var t = e.target; if (t.id === 'lbPrev' || t.id === 'lbNext') return; lb.classList.remove('show'); });

/* ---------- 悬浮二次元播放器 ---------- */
/* 已禁用的音乐（后台「音乐素材库」）不播放 */
var audio = null, mIdx = 0, mList = (C.musics || []).filter(function (m) { return !m.disabled; });
function mName() { return mList.length ? (mList[mIdx].name || mList[mIdx].f) : '暂无音乐'; }
function setPIco(playing) {
    var ico = document.getElementById('pPlayIco');
    ico.innerHTML = playing ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
}
function loadM() {
    if (!mList.length) return;
    if (audio) { audio.pause(); audio = null; }
    audio = new Audio(ASSET_BASE + mList[mIdx].f);
    audio.addEventListener('timeupdate', function () {
        if (audio.duration) document.getElementById('pbar').style.width = (audio.currentTime / audio.duration * 100) + '%';
    });
    audio.addEventListener('ended', function () { nextM(true); });
    document.getElementById('pnm').textContent = mName();
    setPIco(false);
}
function toggleM() {
    if (!mList.length) return;
    if (!audio) loadM();
    if (audio.paused) { audio.play(); setPIco(true); }
    else { audio.pause(); setPIco(false); }
}
function nextM(auto) {
    if (!mList.length) return;
    mIdx = (mIdx + 1) % mList.length;
    loadM();
    if (audio) { audio.play(); setPIco(true); }
}
function prevM() {
    if (!mList.length) return;
    mIdx = (mIdx - 1 + mList.length) % mList.length;
    loadM();
    if (audio) { audio.play(); setPIco(true); }
}
document.getElementById('pPlay').onclick = toggleM;
document.getElementById('pNext').onclick = function () { nextM(false); };
document.getElementById('pnm').textContent = mName();
/* 长条播放器：点击进度条跳转 */
document.getElementById('hbBar').onclick = function (e) {
    if (!audio || !audio.duration) return;
    var r = this.getBoundingClientRect();
    var p = (e.clientX - r.left) / r.width;
    if (p < 0) p = 0; if (p > 1) p = 1;
    audio.currentTime = p * audio.duration;
};


/* ---------- 特效注入 ---------- */
function fxMount(paths) {
    (paths || []).forEach(function (p) {
        var s = document.createElement('script');
        s.src = ASSET_BASE + p;
        document.body.appendChild(s);
    });
}
fxMount(C.fx);
</script>
